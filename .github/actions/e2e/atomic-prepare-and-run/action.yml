name: 'Prepare repo and run Atomic E2E Tests'
description: 'Runs E2E tests with retry & upload logs and screenshots'

runs:
  using: "composite"
  steps:
    - name: "Set up repository"
      uses: ./.github/actions/setup-repo

    - name: "Install dependencies"
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: "Set up E2E environment"
      shell: bash
      run: |
        mkdir screenshots

    - name: Get Playwright version
      id: playwright-version
      shell: bash
      run: echo "version=$(node -e "console.log(require('./package.json').devDependencies['@playwright/test'])")" >> $GITHUB_OUTPUT

    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

    - name: Install Playwright browsers
      if: ${{ steps.playwright-cache.outputs.cache-hit != 'true' }}
      shell: bash
      run: pnpm exec playwright install chromium

    - name: "Run tests, upload screenshots & logs"
      uses: ./.github/actions/e2e/run-log-tests
