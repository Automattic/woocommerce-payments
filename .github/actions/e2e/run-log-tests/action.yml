name: 'Run E2E Tests with Retry & Upload Logs'
description: 'Runs E2E tests with retry & upload logs and screenshots'

runs:
  using: "composite"
  steps:
    - name: First Run E2E Tests
      id: first_run_e2e_tests
      # Use +e to trap errors when running E2E tests.
      shell: /bin/bash +e {0}
      run: |
        npm run test:e2e-ci
        if [[ -f "$E2E_RESULT_FILEPATH" ]]; then
          E2E_NUM_FAILED_TEST_SUITES=$(cat "$E2E_RESULT_FILEPATH" | jq '.stats["unexpected"]')
          echo "FIRST_RUN_FAILED_TEST_SUITES=$(echo $E2E_NUM_FAILED_TEST_SUITES)" >> $GITHUB_OUTPUT
          if [[ ${E2E_NUM_FAILED_TEST_SUITES} -gt 0 ]]; then
            echo "::notice::${E2E_NUM_FAILED_TEST_SUITES} test suite(s) failed in the first run but we will try (it) them again in the second run."
            exit 0
          fi
        else
          echo "FIRST_RUN_FAILED_TEST_SUITES=0" >> $GITHUB_OUTPUT
          exit 0
        fi

    # Retry failed E2E tests
    - name: Re-try Failed E2E Files
      if: ${{ steps.first_run_e2e_tests.outputs.FIRST_RUN_FAILED_TEST_SUITES > 0  }}
      shell: bash
      # Filter failed E2E files from the result JSON file, and re-run them.
      run: |
        # Check if results file exists
        echo "Checking for results file: $E2E_RESULT_FILEPATH"
        if [[ -f "$E2E_RESULT_FILEPATH" ]]; then
          echo "Results file exists, size: $(wc -c < "$E2E_RESULT_FILEPATH") bytes"

          # Extract failed test files using the correct JSON structure
          echo "Extracting failed test files..."

          # Debug: Check the actual JSON structure for failed tests
          echo "Debug: Checking for failed tests in JSON..."
          echo "Stats unexpected: $(cat "$E2E_RESULT_FILEPATH" | jq -r '.stats.unexpected' 2>/dev/null || echo "Failed to get stats")"

          # Try to find any test with unexpected status
          echo "Debug: Looking for tests with unexpected status..."
          cat "$E2E_RESULT_FILEPATH" | jq -r '[.. | select(.status? == "unexpected") | .status] | .[]' 2>/dev/null || echo "No unexpected tests found"

          # Try the correct command that handles nested suites
          echo "Debug: Running jq command to extract failed files..."
          FAILED_FILES=$(cat "$E2E_RESULT_FILEPATH" | jq -r '[.. | select(.tests? and (.tests[] | .status == "unexpected")) | .file] | unique | .[]' 2>/dev/null)
          echo "Debug: jq command exit code: $?"
          echo "Debug: FAILED_FILES content: '$FAILED_FILES'"

          if [[ -n "$FAILED_FILES" ]]; then
            echo "Retrying failed test files: $FAILED_FILES"
            npx playwright test --config=tests/e2e/playwright.config.ts --grep-invert @todo $FAILED_FILES
          else
            echo "No failed test files found to retry"
            echo "Debug: Checking JSON structure..."
            echo "JSON keys: $(cat "$E2E_RESULT_FILEPATH" | jq -r 'keys | .[]' 2>/dev/null || echo "Failed to get keys")"
            echo "Has suites: $(cat "$E2E_RESULT_FILEPATH" | jq -r 'has("suites")' 2>/dev/null || echo "Failed to check suites")"
            echo "Suites count: $(cat "$E2E_RESULT_FILEPATH" | jq -r '.suites | length' 2>/dev/null || echo "Failed to get suites count")"
          fi
        else
          echo "Error: Results file not found at $E2E_RESULT_FILEPATH"
        fi

    # Archive screenshots if any
    - name: Archive e2e test screenshots & logs
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
          name: wp(${{ env.E2E_WP_VERSION }})-wc(${{ env.E2E_WC_VERSION }})-${{ env.E2E_GROUP }}-${{ env.E2E_BRANCH }}
          path: |
            playwright-report/
            tests/e2e/test-results
            ${{ env.E2E_RESULT_FILEPATH }}
          if-no-files-found: ignore
          retention-days: 14
