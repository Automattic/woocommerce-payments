name: 'Run Tests'
description: 'Runs E2E tests with retry & upload logs and screenshots'

runs:
  using: "composite"
  steps:
    - name: Run E2E Tests
      shell: bash
      run: |
        npm run test:e2e-ci

        # If tests failed, retry only the failed tests using --last-failed
        if [[ $? -ne 0 ]]; then
          echo "::notice::Some tests failed, retrying only failed tests with --last-failed flag"
          npm run test:e2e-ci -- --last-failed
        fi

    # Archive screenshots if any
    - name: Archive e2e test screenshots & logs
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
          name: wp(${{ env.E2E_WP_VERSION }})-wc(${{ env.E2E_WC_VERSION }})-${{ env.E2E_GROUP }}-${{ env.E2E_BRANCH }}
          path: |
            playwright-report/
            tests/e2e/test-results
            ${{ env.E2E_RESULT_FILEPATH }}
          if-no-files-found: ignore
          retention-days: 14
