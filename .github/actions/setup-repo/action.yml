name: "Setup WooCommerce Payments repository"
description: "Handles the installation, building, and caching of the projects within the repository."

runs:
  using: composite
  steps:
    # Corepack (bundled with Node) reads `packageManager` from package.json and
    # provisions pnpm. Used instead of pnpm/action-setup, which the Automattic
    # enterprise Actions allowlist blocks.
    - name: "Install pnpm"
      shell: bash
      run: corepack enable

    - name: "Setup Node"
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: ".nvmrc"
        cache: "pnpm"

    - name: "Enable composer dependencies caching"
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/composer/
        key: ${{ runner.os }}-composer-${{ hashFiles('composer.json') }}-${{ hashFiles('composer.lock') }}

    - name: "Set up PHP"
      uses: ./.github/actions/setup-php
