version: 2
updates:
    # Note: npm/pnpm dependency updates are handled by Renovate (see renovate.json).
    # Dependabot does not support pnpm.

    # Enable version updates for composer
    - package-ecosystem: 'composer'
      # Look for `package.json` and `lock` files in the `root` directory
      directory: '/'
      # Check for updates once a week
      schedule:
        interval: 'weekly'
      cooldown:
        default-days: 7
      # Reviewers for issues created
      reviewers:
        - 'Automattic/gamma'
        - 'Automattic/moltres'

    # Enable version updates for Docker
    - package-ecosystem: 'docker'
      # Look for a `Dockerfile` in the `root` directory
      directory: '/'
      # Check for updates once a week
      schedule:
          interval: 'weekly'
      cooldown:
        default-days: 7
      # Reviewers for issues created
      reviewers:
        - 'Automattic/gamma'
        - 'Automattic/moltres'

    # Enable version updates for GitHub Actions (SHA pins in .github/workflows/ and .github/actions/).
    # Scan composite actions too — their SHA-pinned `uses:` refs need update PRs
    # just like the workflow files do ('**' so nested ones like e2e/env-setup are covered).
    - package-ecosystem: 'github-actions'
      directories:
        - '/'
        - '/.github/actions/**'
      # Check for updates once a week
      schedule:
        interval: 'weekly'
      cooldown:
        default-days: 7
      # Reviewers for issues created
      reviewers:
        - 'Automattic/gamma'
        - 'Automattic/moltres'
