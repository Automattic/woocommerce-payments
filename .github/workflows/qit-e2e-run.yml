name: QIT E2E Tests - Run

on:
  workflow_call:
    inputs:
      woocommerce-version:
        description: 'WooCommerce version (nightly, or specific version like 9.6.0, 10.5.0-dev)'
        required: true
        type: string
      wordpress-version:
        description: 'WordPress version (latest, nightly, or specific version)'
        required: false
        type: string
        default: 'latest'
      php-version:
        description: 'PHP version'
        required: true
        type: string
      artifact-name:
        description: 'Name of the artifact containing the built plugin zip'
        required: true
        type: string
      playwright-project:
        description: 'Playwright project to run (shopper, merchant, subscriptions)'
        required: true
        type: string
    secrets:
      QIT_CI_USER:
        required: true
      QIT_CI_SECRET:
        required: true
      E2E_QIT_JP_SITE_ID:
        required: true
      E2E_QIT_JP_BLOG_TOKEN:
        required: true
      E2E_QIT_JP_USER_TOKEN:
        required: true

jobs:
  qit-e2e:
    name: "Run tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Download plugin artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact-name }}

      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
        with:
          php-version: ${{ inputs.php-version }}
          tools: composer
          coverage: none

      - name: Install QIT CLI
        # Pin to a stable release to avoid regressions from dev-trunk.
        # Test packages feature is available since 1.1.0.
        run: composer global require woocommerce/qit-cli:1.1.8

      - name: Authenticate QIT
        run: qit partner:add --user='${{ secrets.QIT_CI_USER }}' --application_password='${{ secrets.QIT_CI_SECRET }}'

      - name: Run QIT E2E Tests
        env:
          E2E_JP_SITE_ID: ${{ secrets.E2E_QIT_JP_SITE_ID }}
          E2E_JP_BLOG_TOKEN: ${{ secrets.E2E_QIT_JP_BLOG_TOKEN }}
          E2E_JP_USER_TOKEN: ${{ secrets.E2E_QIT_JP_USER_TOKEN }}
        run: |
          # QIT provisions its environment (downloading WordPress, WooCommerce, etc.)
          # before any test runs. Those downloads fail transiently now and then — a
          # corrupt WC nightly ZIP or a wp.org/Docker network blip — which sinks the
          # whole cell even though our code is fine (WOOPMNT-6200), then a plain re-run
          # goes green.
          #
          # Distinguish "provisioning flaked" from "tests ran and failed" by what the
          # run produced, not by matching error text (which drifts as QIT changes its
          # messages). The test package's run phase (`npx playwright test`) writes CTRF/
          # blob/allure results into the dirs we upload below; a failure during
          # provisioning never reaches that phase, so they stay empty — that is the
          # "No files were found" we saw in WOOPMNT-6200. So we retry only when nothing
          # was produced, and never re-run a suite that already has a verdict — real
          # regressions (and exhausted attempts) fail fast with the original exit code.
          max_attempts=3
          attempt=1
          # Same paths the "Upload test results" step collects.
          results_dirs=( "tests/qit/test-package/test-results" "qit-results" )

          run_qit() {
            qit run:e2e woocommerce-payments \
              --zip=woocommerce-payments.zip \
              --config tests/qit/qit.json \
              --woo=${{ inputs.woocommerce-version }} \
              --wp=${{ inputs.wordpress-version }} \
              --php=${{ inputs.php-version }} \
              --env E2E_JP_SITE_ID=$E2E_JP_SITE_ID \
              --env E2E_JP_BLOG_TOKEN=$E2E_JP_BLOG_TOKEN \
              --env E2E_JP_USER_TOKEN=$E2E_JP_USER_TOKEN \
              --wait \
              --print-report-url \
              -- --project=${{ inputs.playwright-project }}
          }

          # True once the run phase has executed — i.e. tests actually ran (pass or fail).
          produced_results() {
            local d
            for d in "${results_dirs[@]}"; do
              [ -d "$d" ] && [ -n "$(find "$d" -type f -print -quit 2>/dev/null)" ] && return 0
            done
            return 1
          }

          while true; do
            # Clear any prior attempt's leftovers so the check reflects THIS attempt.
            rm -rf "${results_dirs[@]}"

            set +e
            run_qit
            code=$?
            set -e

            [ "$code" -eq 0 ] && exit 0

            if [ "$attempt" -ge "$max_attempts" ] || produced_results; then
              # Tests ran and failed (real), or out of attempts — surface code unchanged.
              exit "$code"
            fi

            echo "::warning::QIT failed before producing any test results (attempt ${attempt}/${max_attempts}) — environment provisioning likely flaked; retrying after backoff."
            sleep "$(( attempt * 15 ))"
            attempt="$(( attempt + 1 ))"
          done

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qit-e2e-results-wp${{ inputs.wordpress-version }}-wc${{ inputs.woocommerce-version }}-php${{ inputs.php-version }}-${{ inputs.playwright-project }}
          path: |
            tests/qit/test-package/test-results/
            qit-results/
          retention-days: 7
