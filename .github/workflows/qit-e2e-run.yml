name: QIT E2E Tests - Run

on:
  workflow_call:
    inputs:
      woocommerce-version:
        description: 'WooCommerce version (nightly, or specific version like 9.6.0, 10.5.0-dev)'
        required: true
        type: string
      wordpress-version:
        description: 'WordPress version (latest, nightly, or specific version)'
        required: false
        type: string
        default: 'latest'
      php-version:
        description: 'PHP version'
        required: true
        type: string
      artifact-name:
        description: 'Name of the artifact containing the built plugin zip'
        required: true
        type: string
      playwright-project:
        description: 'Playwright project to run (shopper, merchant, subscriptions)'
        required: true
        type: string
    secrets:
      QIT_CI_USER:
        required: true
      QIT_CI_SECRET:
        required: true
      E2E_QIT_JP_SITE_ID:
        required: true
      E2E_QIT_JP_BLOG_TOKEN:
        required: true
      E2E_QIT_JP_USER_TOKEN:
        required: true

jobs:
  qit-e2e:
    name: "Run tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Download plugin artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact-name }}

      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
        with:
          php-version: ${{ inputs.php-version }}
          tools: composer
          coverage: none

      - name: Install QIT CLI
        # Pin to a stable release to avoid regressions from dev-trunk.
        # Test packages feature is available since 1.1.0.
        run: composer global require woocommerce/qit-cli:1.1.8

      - name: Authenticate QIT
        run: qit partner:add --user='${{ secrets.QIT_CI_USER }}' --application_password='${{ secrets.QIT_CI_SECRET }}'

      - name: Run QIT E2E Tests
        env:
          E2E_JP_SITE_ID: ${{ secrets.E2E_QIT_JP_SITE_ID }}
          E2E_JP_BLOG_TOKEN: ${{ secrets.E2E_QIT_JP_BLOG_TOKEN }}
          E2E_JP_USER_TOKEN: ${{ secrets.E2E_QIT_JP_USER_TOKEN }}
        run: |
          # QIT provisions its environment (downloading WordPress, WooCommerce, etc.)
          # before any test runs. Those downloads fail transiently now and then — a
          # corrupt WC nightly ZIP or a wp.org/Docker network blip — which sinks the
          # whole cell even though our code is fine (WOOPMNT-6200). Retry ONLY those
          # provisioning-phase failures; a genuine test failure exits immediately so
          # real regressions still fail fast.
          #
          # No cache wipe is needed between attempts: QIT's ExtensionCacheManager opens
          # cached ZIPs with ZipArchive::CHECKCONS at the start of every run and unlinks
          # any invalid/partial file, so a clean re-invocation re-downloads on its own.
          max_attempts=3
          attempt=1
          # Substrings QIT emits while building the environment, before tests start.
          transient_re='Failed to parse environment JSON|Invalid ZIP file downloaded|appears to be invalid|Failed to connect|Couldn.t connect to server|Could not resolve host|Connection timed out'

          run_qit() {
            qit run:e2e woocommerce-payments \
              --zip=woocommerce-payments.zip \
              --config tests/qit/qit.json \
              --woo=${{ inputs.woocommerce-version }} \
              --wp=${{ inputs.wordpress-version }} \
              --php=${{ inputs.php-version }} \
              --env E2E_JP_SITE_ID=$E2E_JP_SITE_ID \
              --env E2E_JP_BLOG_TOKEN=$E2E_JP_BLOG_TOKEN \
              --env E2E_JP_USER_TOKEN=$E2E_JP_USER_TOKEN \
              --wait \
              --print-report-url \
              -- --project=${{ inputs.playwright-project }}
          }

          # Capture each attempt's output so we can both stream it live (tee) and
          # inspect it for the transient signatures. One reusable file, cleaned up on
          # any exit path; tee truncates it fresh each attempt.
          log="$(mktemp)"
          trap 'rm -f "$log"' EXIT

          while true; do
            set +e
            run_qit 2>&1 | tee "$log"
            code=${PIPESTATUS[0]}
            set -e

            [ "$code" -eq 0 ] && exit 0

            if [ "$attempt" -ge "$max_attempts" ] || ! grep -qE "$transient_re" "$log"; then
              # Out of attempts, or a non-provisioning failure (e.g. a real test
              # failure) — surface the original exit code unchanged.
              exit "$code"
            fi

            echo "::warning::Transient QIT environment-provisioning failure (attempt ${attempt}/${max_attempts}); retrying after backoff."
            sleep "$(( attempt * 15 ))"
            attempt="$(( attempt + 1 ))"
          done

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qit-e2e-results-wp${{ inputs.wordpress-version }}-wc${{ inputs.woocommerce-version }}-php${{ inputs.php-version }}-${{ inputs.playwright-project }}
          path: |
            tests/qit/test-package/test-results/
            qit-results/
          retention-days: 7
