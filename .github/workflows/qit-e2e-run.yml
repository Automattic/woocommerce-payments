name: QIT E2E Tests - Run

on:
  workflow_call:
    inputs:
      woocommerce-version:
        description: 'WooCommerce version (nightly, or specific version like 9.6.0, 10.5.0-dev)'
        required: true
        type: string
      wordpress-version:
        description: 'WordPress version (latest, nightly, or specific version)'
        required: false
        type: string
        default: 'latest'
      php-version:
        description: 'PHP version'
        required: true
        type: string
      artifact-name:
        description: 'Name of the artifact containing the built plugin zip'
        required: true
        type: string
      playwright-project:
        description: 'Playwright project to run (shopper, merchant, subscriptions)'
        required: true
        type: string
    secrets:
      QIT_CI_USER:
        required: true
      QIT_CI_SECRET:
        required: true
      E2E_QIT_JP_SITE_ID:
        required: true
      E2E_QIT_JP_BLOG_TOKEN:
        required: true
      E2E_QIT_JP_USER_TOKEN:
        required: true

jobs:
  qit-e2e:
    name: "Run tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download plugin artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact-name }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          tools: composer
          coverage: none

      - name: Install QIT CLI
        # Pin to a stable release to avoid regressions from dev-trunk.
        # Test packages feature is available since 1.1.0.
        run: composer global require woocommerce/qit-cli:1.1.9

      - name: Authenticate QIT
        run: qit partner:add --user='${{ secrets.QIT_CI_USER }}' --application_password='${{ secrets.QIT_CI_SECRET }}'

      - name: Run QIT E2E Tests
        env:
          E2E_JP_SITE_ID: ${{ secrets.E2E_QIT_JP_SITE_ID }}
          E2E_JP_BLOG_TOKEN: ${{ secrets.E2E_QIT_JP_BLOG_TOKEN }}
          E2E_JP_USER_TOKEN: ${{ secrets.E2E_QIT_JP_USER_TOKEN }}
        # TEMP DIAGNOSTIC: --verbose added to capture upstream URL + response
        # while investigating "Invalid ZIP file downloaded for 'woocommerce'"
        # failures on `--woo=*-dev` snapshots. Revert once root cause confirmed.
        run: |
          qit run:e2e woocommerce-payments \
            --zip=woocommerce-payments.zip \
            --config tests/qit/qit.json \
            --woo=${{ inputs.woocommerce-version }} \
            --wp=${{ inputs.wordpress-version }} \
            --php=${{ inputs.php-version }} \
            --env E2E_JP_SITE_ID=$E2E_JP_SITE_ID \
            --env E2E_JP_BLOG_TOKEN=$E2E_JP_BLOG_TOKEN \
            --env E2E_JP_USER_TOKEN=$E2E_JP_USER_TOKEN \
            --wait \
            --print-report-url \
            --verbose \
            -- --project=${{ inputs.playwright-project }}

      # TEMP DIAGNOSTIC: dumps QIT's plugin cache when the run fails, so we can
      # tell *why* the WooCommerce ZIP was rejected (truncated, HTML body, 0
      # bytes, etc.). Remove together with the --verbose flag above.
      - name: Capture QIT cache forensics on failure
        if: failure()
        run: |
          set +e
          CACHE_DIR="$HOME/.config/woo-qit-cli/cache/plugin"
          echo "::group::QIT CLI version"
          qit --version || true
          echo "::endgroup::"

          echo "::group::Cache directory listing"
          ls -la "$CACHE_DIR" 2>&1 || echo "Cache dir not present: $CACHE_DIR"
          echo "::endgroup::"

          shopt -s nullglob
          for f in "$CACHE_DIR"/*.zip; do
            echo "::group::File: $f"
            ls -la "$f"
            file "$f" || true
            echo "--- unzip -l (truncated) ---"
            unzip -l "$f" 2>&1 | head -20
            echo "--- head -c 500 ---"
            head -c 500 "$f" | od -c | head -20
            echo "::endgroup::"
          done

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qit-e2e-results-wp${{ inputs.wordpress-version }}-wc${{ inputs.woocommerce-version }}-php${{ inputs.php-version }}-${{ inputs.playwright-project }}
          path: |
            tests/qit/test-package/test-results/
            qit-results/
          retention-days: 7
