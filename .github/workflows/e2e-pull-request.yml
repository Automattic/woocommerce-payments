name: E2E token access probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  token-access:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare E2E and bot token access
        env:
          OLD_TOKEN: ${{ secrets.E2E_GH_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOTWOO_TOKEN }}
          SUBSCRIPTIONS_REPO: ${{ secrets.WC_SUBSCRIPTIONS_REPO }}
        shell: python
        run: |
          import io
          import json
          import os
          import subprocess
          import zipfile

          def request(token, path, accept="application/vnd.github+json"):
              config = "\n".join([
                  "url = " + json.dumps("https://api.github.com/" + path),
                  "header = " + json.dumps("Authorization: token " + token),
                  "header = " + json.dumps("Accept: " + accept),
              ])
              result = subprocess.run(
                  ["curl", "--silent", "--location", "--max-time", "90",
                   "--config", "-", "--write-out", "\n%{http_code}"],
                  input=config.encode(), capture_output=True,
              )
              if result.returncode:
                  print("Request failed with curl exit code", result.returncode)
                  return 0, b""
              body, status = result.stdout.rsplit(b"\n", 1)
              return int(status), body

          def probe(label, token):
              print(label + ":")
              if not token:
                  print("  Secret is missing")
                  return False
              repo = os.environ["SUBSCRIPTIONS_REPO"]
              status, body = request(token, "repos/" + repo + "/releases/latest")
              print("  Subscriptions release lookup: HTTP", status)
              if status != 200:
                  return False
              assets = json.loads(body).get("assets", [])
              if not assets:
                  print("  Release has no assets")
                  return False
              status, archive = request(
                  token, "repos/" + repo + "/releases/assets/" + str(assets[0]["id"]),
                  "application/octet-stream",
              )
              print("  Subscriptions asset download: HTTP", status)
              if status != 200 or not zipfile.is_zipfile(io.BytesIO(archive)):
                  print("  No valid ZIP received")
                  return False
              with zipfile.ZipFile(io.BytesIO(archive)) as bundle:
                  if bundle.testzip() is not None:
                      print("  ZIP integrity check failed")
                      return False
              print("  ZIP integrity: passed")
              status, _ = request(
                  token, "repos/Automattic/woocommerce-payments-dev-tools/contents/"
              )
              print("  Dev-tools repository contents: HTTP", status)
              return status == 200

          probe("Existing E2E_GH_TOKEN", os.environ["OLD_TOKEN"])
          if not probe("Candidate BOTWOO_TOKEN", os.environ["BOT_TOKEN"]):
              raise SystemExit(1)
