name: "Release - Create release PRs"

# This action will run inside the release code freeze workflow or when it is triggered manually
on:
  workflow_call:
    inputs:
      releaseVersion:
        description: 'The release version (e.g. 4.5.0)'
        required: true
        type: string
      releaseDateString:
        description: "The release date in human-readable format (default: 'next wednesday')."
        required: false
        default: "next wednesday"
        type: string
      skip-smoke-tests:
        type: boolean
        required: false
        default: false
        description: "Skip running smoke tests"
    outputs:
      release-pr-id:
        description: "ID of the release PR created"
        value: ${{ jobs.prepare-release.outputs.release-pr-id }}
      develop-pr-url:
        description: "URL of the develop sync PR created"
        value: ${{ jobs.sync-develop.outputs.develop-pr-url }}


  workflow_dispatch:
    inputs:
      releaseVersion:
        description: 'The release version (e.g. 4.5.0)'
        required: true
        type: string
      releaseDateString:
        description: "The release date in human-readable format (default: 'next wednesday')."
        required: false
        default: "next wednesday"
        type: string
      skip-build-zip:
        type: boolean
        required: false
        default: true
        description: "Skip building the zip file"
      skip-smoke-tests:
        type: boolean
        required: false
        default: false
        description: "Skip running smoke tests"
      dry-run:
        type: boolean
        required: false
        default: false
        description: "Dry-run: create branch, bump, and validate, but do not push, open a PR, or run smoke tests"

defaults:
  run:
    shell: bash

jobs:
  prepare-release:
    name: "Prepare a stable release"
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.create_branch.outputs.branch-name }}
      version: ${{ steps.create_branch.outputs.trimmed-version }}
      release-pr-id: ${{ steps.create-pr-to-trunk.outputs.RELEASE_PR_ID }}
    env:
      RELEASE_VERSION: ${{ inputs.releaseVersion }}
      RELEASE_DATE_STRING: ${{ inputs.releaseDateString }}

    steps:
      # Full history, so the release branch can merge trunk.
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: "Set up repository"
        uses: ./.github/actions/setup-repo

      - name: "Create a release branch"
        id: create_branch
        uses: ./.github/actions/create-branch
        with:
          version: ${{ env.RELEASE_VERSION }}
          is-pre-release: 'false'
          push: ${{ inputs.dry-run == true && 'false' || 'true' }}

      # trunk is no longer merged back into develop, so the release PR conflicts
      # with trunk on the version files, and GitHub runs no CI on a PR with
      # conflicts. Merging trunk while keeping the release side clears them.
      # "Commit and push changes" pushes the merge along with the version bump.
      - name: "Merge trunk into the release branch"
        run: |
          # `-s ours` drops anything only trunk has, such as a patch-release fix
          # that never reached develop. A normal merge keeps it, so stop if one
          # would change more than the files the release rewrites anyway.
          # Exit code 1 means conflicts that -X ours can't settle, such as trunk
          # editing a file develop deleted; the diff still lists those files.
          MERGED=$(git merge-tree --write-tree --no-messages -X ours HEAD origin/trunk) || [ $? -eq 1 ]
          TRUNK_ONLY=$(git diff --name-status HEAD "$(head -n1 <<< "$MERGED")" -- \
            ':!changelog/' ':!changelog.txt' ':!readme.txt' ':!package.json' ':!woocommerce-payments.php')
          if [ -n "$TRUNK_ONLY" ]; then
            {
              echo "## :x: trunk has changes that develop lacks"
              echo ''
              echo "Bring them into develop, then start a new run of this workflow."
              echo ''
              echo '```'
              echo "$TRUNK_ONLY"
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge -s ours --no-edit origin/trunk

      - name: "Define the release date"
        id: define_var
        run: |
          RELEASE_DATE=$( date "+%Y-%m-%d" -d "$RELEASE_DATE_STRING" ) # Release date formatted as YYYY-MM-DD
          echo "RELEASE_DATE=$RELEASE_DATE" >> $GITHUB_OUTPUT

      - name: "Generate the changelog"
        id: generate_changelog
        uses: ./.github/actions/process-changelog
        with:
          release-version: ${{ steps.create_branch.outputs.trimmed-version }}
          release-date: ${{ steps.define_var.outputs.RELEASE_DATE }}

      - name: "Bump version"
        env:
          RELEASE_VERSION: ${{ steps.create_branch.outputs.trimmed-version }}
        run: ./bin/bump-version.sh "$RELEASE_VERSION"

      - name: "Commit and push changes"
        if: ${{ ! inputs.dry-run }}
        env:
          RELEASE_VERSION: ${{ steps.create_branch.outputs.trimmed-version }}
          BRANCH_NAME: ${{ steps.create_branch.outputs.branch-name }}
        uses: ./.github/actions/commit-push-as-bot
        with:
          release-version: ${{ env.RELEASE_VERSION }}
          branch: ${{ env.BRANCH_NAME }}

      - name: "Validate release branch"
        if: ${{ ! inputs.dry-run }}
        run: ./bin/validate-release-branch.sh

      - name: "Create a PR to trunk"
        if: ${{ ! inputs.dry-run }}
        id: create-pr-to-trunk
        env:
          GITHUB_TOKEN: ${{ secrets.BOTWOO_TOKEN }}
          BRANCH_NAME: ${{ steps.create_branch.outputs.branch-name }}
          CHANGELOG: ${{ steps.generate_changelog.outputs.changelog }}
          RELEASE_VERSION: ${{ steps.create_branch.outputs.trimmed-version }}
        run: |
          PR_BODY=$(echo -e ":warning: Please do not merge the PR from the GitHub interface. :warning:\n\n Instead, you can use the following command:\n\`\`\`\n git checkout $BRANCH_NAME && git pull \n git checkout trunk && git pull \n git merge --no-ff $BRANCH_NAME -m 'Merge $BRANCH_NAME into trunk' \n git push origin trunk \n\`\`\` \n Changelog: \n\`\`\`\n${CHANGELOG}\n\`\`\`")
          PR_URL=$(gh pr create --title "Release branch for $RELEASE_VERSION" --body="$PR_BODY" --base="trunk")
          PR_ID=${PR_URL##*/}
          if [[ $PR_ID =~ ^[0-9]+$ ]]; then
            echo "RELEASE_PR_ID=$PR_ID" >> $GITHUB_OUTPUT
          fi

      - name: "Add comment to PR to trunk"
        if: ${{ ! inputs.dry-run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PR_ID: ${{ steps.create-pr-to-trunk.outputs.RELEASE_PR_ID }}
        run: |
          gh pr comment https://github.com/Automattic/woocommerce-payments/pull/$RELEASE_PR_ID --body="### Release zip build & Smoke tests

          Check status of zip file build & smoke tests at https://github.com/Automattic/woocommerce-payments/actions/runs/${GITHUB_RUN_ID}"

      - name: "Dry-run summary"
        # Run even if an earlier step failed, so the diff is always reported
        # in dry-run mode — otherwise a failure upstream produces no feedback.
        if: ${{ !cancelled() && inputs.dry-run }}
        run: |
          {
            echo "## Dry run"
            echo ''
            echo "No push, no PR, no smoke tests. The following diff would have been committed to the release branch:"
            echo ''
            echo '```diff'
            git --no-pager diff -- woocommerce-payments.php package.json readme.txt
            echo '```'
            echo ''
            echo '### pnpm-lock.yaml'
            echo ''
            echo '```'
            git --no-pager diff --stat -- pnpm-lock.yaml
            echo '```'
            echo ''
            echo '### Untracked files'
            echo ''
            echo '```'
            git status --short
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  sync-develop:
    name: "Sync develop"
    needs: prepare-release
    if: ${{ ! inputs.dry-run }}
    uses: ./.github/workflows/release-sync-develop.yml
    with:
      releaseVersion: ${{ needs.prepare-release.outputs.version }}
    secrets: inherit

  build-zip-and-run-smoke-tests:
    name: "Build zip & Run smoke tests"
    needs: prepare-release
    if: ${{ ! inputs.skip-build-zip && ! inputs.dry-run }}
    uses: ./.github/workflows/build-zip-and-run-smoke-tests.yml
    with:
      skip-smoke-tests: ${{ inputs.skip-smoke-tests }}
      repo-branch: ${{ needs.prepare-release.outputs.branch }}
    secrets: inherit
