name: JS linting and tests

on:
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name:    JS linting
    runs-on: ubuntu-latest
    steps:
      # clone the repository
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # corepack (bundled with Node) provisions pnpm; pnpm/action-setup is
      # blocked by the Automattic enterprise Actions allowlist.
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      # enable dependencies caching
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/
          key:  ${{ runner.os }}-composer-${{ hashFiles('composer.json') }}-${{ hashFiles('composer.lock') }}
      # install dependencies and run linter
      - run: pnpm install --frozen-lockfile && pnpm run lint:js && pnpm run lint:css

  test:
    name:    JS testing
    runs-on: ubuntu-latest
    steps:
      # clone the repository
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # corepack (bundled with Node) provisions pnpm; pnpm/action-setup is
      # blocked by the Automattic enterprise Actions allowlist.
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      # enable dependencies caching
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/
          key:  ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
      # install dependencies and run linter
      - run: pnpm install --frozen-lockfile && pnpm run test:js
