name: JS linting and tests

permissions:
  contents: read

on:
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name:    JS linting
    runs-on: ubuntu-latest
    steps:
      # clone the repository
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # CI installs from registry.npmjs.org, so these URLs pass here but break frozen
      # installs through any other registry. Dependabot lockfile updates can add them.
      - name: Check the lockfile has no registry tarball URLs
        run: |
          if grep -n 'tarball: https://registry.npmjs.org/' pnpm-lock.yaml; then
            echo "::error file=pnpm-lock.yaml::Remove the registry.npmjs.org tarball URLs listed above and keep their integrity hashes. See 'Dependencies & supply-chain cooldown' in .claude/docs/agent-development.md."
            exit 1
          fi
      # corepack (bundled with Node) provisions pnpm; pnpm/action-setup is
      # blocked by the Automattic enterprise Actions allowlist.
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      # enable dependencies caching
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/
          key:  ${{ runner.os }}-composer-${{ hashFiles('composer.json') }}-${{ hashFiles('composer.lock') }}
      # install dependencies and run linter
      - run: pnpm install --frozen-lockfile && pnpm run lint:js && pnpm run lint:css

  test:
    name:    JS testing
    runs-on: ubuntu-latest
    steps:
      # clone the repository
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # corepack (bundled with Node) provisions pnpm; pnpm/action-setup is
      # blocked by the Automattic enterprise Actions allowlist.
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      # enable dependencies caching
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/
          key:  ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
      # install dependencies and run linter
      - run: pnpm install --frozen-lockfile
      - name: Cache Jest transforms
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/jest
          key: ${{ runner.os }}-jest-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml', 'babel.config.js', 'tsconfig.json', 'tests/js/**') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-jest-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml', 'babel.config.js', 'tsconfig.json', 'tests/js/**') }}-
      - run: pnpm run test:js
