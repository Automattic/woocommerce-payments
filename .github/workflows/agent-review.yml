name: "Agent Pipeline — Review Stage"

on:
  workflow_call:
    inputs:
      linear_issue_id:
        type: string
        required: true
        description: "Linear issue ID (e.g. GAMMA-123) or issue description"
      target_branch:
        type: string
        required: false
        default: "develop"
        description: "Base branch to work from"
      branch_name:
        type: string
        required: true
        description: "Feature branch to review (created by dev stage)"
      model:
        type: string
        required: false
        default: "claude-sonnet-4-5-20250929"
        description: "Claude model to use"

jobs:
  review:
    name: "Review: ${{ inputs.linear_issue_id }}"
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout WooPayments
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.branch_name }}
          fetch-depth: 0

      - name: Checkout WooCommerce (context)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: woocommerce/woocommerce
          path: woocommerce
          sparse-checkout: |
            plugins/woocommerce/includes
            plugins/woocommerce/src
            plugins/woocommerce-blocks

      - name: Checkout gamma-ai-tools (prompt templates)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: Automattic/gamma-ai-tools
          github-server-url: https://github.a8c.com
          token: ${{ secrets.GHE_TOKEN }}
          path: .gamma-ai-tools
          sparse-checkout: prompts/pipeline

      - name: Prepare prompt from template
        id: prompt
        env:
          LINEAR_ISSUE_ID: ${{ inputs.linear_issue_id }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          BRANCH_NAME: ${{ inputs.branch_name }}
        run: |
          TEMPLATE=".gamma-ai-tools/prompts/pipeline/review.md"
          if [ ! -f "$TEMPLATE" ]; then
            echo "::error::Prompt template not found: $TEMPLATE"
            exit 1
          fi

          # Substitute variables. Inputs are read from the environment so their
          # values never reach the shell parser as literal command text.
          sed \
            -e "s|{{LINEAR_ISSUE_ID}}|${LINEAR_ISSUE_ID}|g" \
            -e "s|{{TARGET_BRANCH}}|${TARGET_BRANCH}|g" \
            -e "s|{{BRANCH_NAME}}|${BRANCH_NAME}|g" \
            "$TEMPLATE" > /tmp/review-prompt.md

          # Write multiline output
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "content<<$EOF" >> "$GITHUB_OUTPUT"
          cat /tmp/review-prompt.md >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - name: Clean up gamma-ai-tools checkout
        run: rm -rf .gamma-ai-tools

      - name: Run Review Agent
        id: review
        uses: anthropics/claude-code-action@0f97b95b6536c26e5f6bd90faec370d41695beca # v1.0.144
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: ${{ inputs.model }}
          prompt: ${{ steps.prompt.outputs.content }}
          max_turns: "50"
          allowed_tools: "Read,Glob,Grep,Bash(git log*),Bash(git blame*),Bash(git show*),Bash(git diff*),Bash(wc *),Bash(find *),Write(review-report.md),Write(/tmp/pr-review/*)"

      - name: Upload review-report.md as artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-${{ inputs.linear_issue_id }}
          path: review-report.md
          retention-days: 14
          if-no-files-found: warn

      - name: Write job summary
        if: always()
        env:
          LINEAR_ISSUE_ID: ${{ inputs.linear_issue_id }}
          BRANCH_NAME: ${{ inputs.branch_name }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          MODEL: ${{ inputs.model }}
        run: |
          echo "## Review Agent Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Issue:** ${LINEAR_ISSUE_ID}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Branch:** ${BRANCH_NAME}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Base:** ${TARGET_BRANCH}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Model:** ${MODEL}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ -f review-report.md ]; then
            echo "**Status:** review-report.md generated" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "<details><summary>Full review-report.md</summary>" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            cat review-report.md >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "</details>" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Status:** review-report.md was NOT generated" >> "$GITHUB_STEP_SUMMARY"
          fi
