name: PHP linting and tests

on:
  pull_request:
  merge_group:

env:
  WP_VERSION:        latest
  WC_MIN_SUPPORTED_VERSION: '7.6.0'
  PHP_MIN_SUPPORTED_VERSION: '7.4'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name:    PHP linting
    runs-on: ubuntu-latest
    steps:
      # clone the repository
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # enable dependencies caching
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.json') }}-${{ hashFiles('composer.lock') }}
      # setup PHP, but without debug extensions for reasonable performance
      - name: "Set up PHP"
        uses: ./.github/actions/setup-php
      # install dependencies and run linter
      - run: composer self-update && composer install --no-progress --ignore-platform-req=php && ./vendor/bin/phpcs --standard=phpcs.xml.dist $(git ls-files | grep .php$) && composer run phpstan

  generate-test-matrix:
    name: "Generate the matrix for php tests dynamically"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate_matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Load version constants"
        id: vc
        uses: ./.github/actions/load-version-constants
      - name: "Generate matrix"
        id: generate_matrix
        env:
          GUTENBERG_FOR_PHP_MIN: ${{ steps.vc.outputs.gutenberg_for_php_min }}
        run: |
          matrix=$(jq -cn \
            --arg php_min "$PHP_MIN_SUPPORTED_VERSION" \
            --arg wc_min "$WC_MIN_SUPPORTED_VERSION" \
            --arg gutenberg_min "$GUTENBERG_FOR_PHP_MIN" \
            '{include: [
              {php: $php_min, woocommerce: $wc_min, gutenberg: "latest"},
              {php: $php_min, woocommerce: $wc_min, gutenberg: $gutenberg_min},
              {php: "8.3", woocommerce: "latest", gutenberg: "latest"},
              {php: "8.4", woocommerce: "latest", gutenberg: "latest"}
            ]}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  test:
    name: PHP testing
    needs: generate-test-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.generate-test-matrix.outputs.matrix) }}
    steps:
      # clone the repository
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # enable dependencies caching
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/
          key:  ${{ runner.os }}-composer-${{ hashFiles('composer.json') }}-${{ hashFiles('composer.lock') }}
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          tools:       composer
          coverage:    none
      # run CI checks
      - run: bash bin/run-ci-tests.bash
        env:
          WC_VERSION: ${{ matrix.woocommerce }}
          GUTENBERG_VERSION: ${{ matrix.gutenberg }}
