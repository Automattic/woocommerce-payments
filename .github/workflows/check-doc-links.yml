name: Check documentation links

on:
    pull_request:
        paths:
            - '.github/scripts/check-doc-links.js'
            - '.github/scripts/tests/**'
            - '.github/workflows/check-doc-links.yml'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - 'pnpm-workspace.yaml'
            - '.nvmrc'
    merge_group:
    workflow_dispatch:
        inputs:
            ref:
                description: 'Branch, tag or SHA to scan (e.g. release/11.2.0); defaults to the selected workflow ref'
                type: string
                required: false

permissions:
    contents: read

concurrency:
    group: documentation-links-${{ inputs.ref || github.ref }}
    cancel-in-progress: true

jobs:
    test:
        name: Test documentation link checker
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout checker
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - run: corepack enable
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: '.nvmrc'
                  cache: 'pnpm'
            - run: pnpm install --frozen-lockfile --ignore-scripts

            - name: Lint checker
              run: pnpm exec eslint --no-ignore .github/scripts/check-doc-links.js .github/scripts/tests/test-check-doc-links.js

            - name: Run offline tests
              run: node --test .github/scripts/tests/test-check-doc-links.js

    check:
        if: github.event_name == 'workflow_dispatch'
        needs: test
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout checker
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - run: corepack enable
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: '.nvmrc'
                  cache: 'pnpm'
            - run: pnpm install --frozen-lockfile --ignore-scripts

            # The target checkout is data only: never run its scripts or install its dependencies.
            - name: Checkout plugin source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ inputs.ref || github.sha }}
                  path: source
                  persist-credentials: false

            - name: Check documentation URLs and anchors
              env:
                  DOC_LINK_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: node .github/scripts/check-doc-links.js --root source --report "$RUNNER_TEMP/documentation-links.md"
