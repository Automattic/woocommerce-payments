name: Deploy - WordPress.org

# Deploys the plugin to WordPress.org with the Woo Product Deploy Action.
# Runs in simulation mode by default; untick "simulate" for a live deploy.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (x.y.z)'
        required: true
      branch:
        description: 'Branch to deploy from (e.g. trunk or release/x.y.z)'
        required: true
        default: 'trunk'
      simulate:
        description: 'Simulation mode (dry run)'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    permissions:
      contents: read
    name: "Deploy ${{ inputs.version }} from ${{ inputs.branch }}${{ inputs.simulate && ' (simulation)' || '' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Validate QIT credentials
        shell: bash
        env:
          QIT_CI_USER: ${{ secrets.QIT_CI_USER }}
          QIT_CI_SECRET: ${{ secrets.QIT_CI_SECRET }}
        run: |
          if [[ -z "$QIT_CI_USER" || -z "$QIT_CI_SECRET" ]]; then
            echo "::error::QIT_CI_USER and QIT_CI_SECRET must both be configured before deployment."
            exit 1
          fi

      # Build here and hand the zip to the action, so QIT tests the file that ships.
      # Left to itself, the action builds twice in a target-repo folder, which also
      # ends up as the plugin slug in the POT header.
      - name: Checkout branch to deploy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}
          persist-credentials: false

      - name: Set up repository
        uses: ./.github/actions/setup-repo

      - name: Build the plugin
        id: build_plugin
        uses: ./.github/actions/build

      - name: Upload the zip file as an artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.build_plugin.outputs.release-filename }}
          archive: false
          if-no-files-found: error
          retention-days: 14

      # woo-product-deploy is a private repo, so it needs a token to check out
      - name: Checkout woo-product-deploy action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: woocommerce/woo-product-deploy
          ref: 0ef871021cdf6c4183a6b0470ee6a7be844d748a # reuse tested checkout and pin nested actions
          path: ./.github/actions/woo-product-deploy
          token: ${{ secrets.WOO_DEPLOY_SECRET }}
          persist-credentials: false

      - name: Deploy to WordPress.org
        uses: ./.github/actions/woo-product-deploy
        with:
          repo_url: ${{ github.server_url }}/${{ github.repository }}
          branch: ${{ inputs.branch }}
          version: ${{ inputs.version }}
          zip: ${{ steps.build_plugin.outputs.release-filename }}
          node_version: '24'
          npm_version: '11'
          simulate: ${{ inputs.simulate }}
          wporg_release: true
          # post-release-updates.yml already creates the GitHub release and tag
          github_release: false
          deploy_pat: ${{ secrets.WOO_DEPLOY_SECRET }}
          wporg_username: ${{ secrets.WPORG_USERNAME }}
          wporg_password: ${{ secrets.WPORG_PASSWORD }}
          partner_user: ${{ secrets.QIT_CI_USER }}
          partner_secret: ${{ secrets.QIT_CI_SECRET }}
