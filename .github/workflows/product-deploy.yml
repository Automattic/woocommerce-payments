name: Validate - WordPress.org deployment simulation

# Temporary pre-merge validation. All deployment inputs are fixed to simulation.
on:
  push:
    branches:
      - validate-product-deploy-simulation-20260908

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    permissions:
      contents: read
    name: Simulate 11.1.0 from add/product-deploy-workflow
    runs-on: ubuntu-latest
    steps:
      # woo-product-deploy is a private repo, so it needs a token to check out
      - name: Checkout woo-product-deploy action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: woocommerce/woo-product-deploy
          ref: 5f5b49d49b8a3681a7a99efec089187666885759 # pnpm build support
          path: ./.github/actions/woo-product-deploy
          token: ${{ secrets.WOO_DEPLOY_SECRET }}

      - name: Deploy to WordPress.org
        uses: ./.github/actions/woo-product-deploy
        with:
          repo_url: ${{ github.server_url }}/${{ github.repository }}
          branch: add/product-deploy-workflow
          version: '11.1.0'
          node_version: '24'
          npm_version: '11'
          simulate: true
          wporg_release: true
          # post-release-updates.yml already creates the GitHub release and tag
          github_release: false
          deploy_pat: ${{ secrets.WOO_DEPLOY_SECRET }}
          wporg_username: ${{ secrets.WPORG_USERNAME }}
          wporg_password: ${{ secrets.WPORG_PASSWORD }}
          partner_user: ${{ secrets.QIT_CI_USER }}
          partner_secret: ${{ secrets.QIT_CI_SECRET }}
