name: Compatibility - WC, WP and PHP

on:
  pull_request:
  # Also run on a schedule so WC beta and WP nightly breakage is caught in quiet weeks
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

env:
  WC_MIN_SUPPORTED_VERSION: '7.6.0'
  WP_MIN_SUPPORTED_VERSION: '6.0'
  PHP_MIN_SUPPORTED_VERSION: '7.4'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-wc-compat-matrix:
    name: "Generate the matrix for woocommerce compatibility dynamically"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate_matrix.outputs.matrix }}
      has_beta: ${{ steps.generate_matrix.outputs.has_beta }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Load version constants"
        id: vc
        uses: ./.github/actions/load-version-constants
      - name: "Generate matrix"
        id: generate_matrix
        env:
          GUTENBERG_FOR_WP_MIN: ${{ steps.vc.outputs.gutenberg_for_wp_min }}
        run: |
          # Once its stable release ships, the beta would only repeat the `latest` runs.
          BETA_VERSION=$( .github/scripts/generate-wc-matrix.sh | jq -r '.metadata.beta_version' )
          if [[ "$BETA_VERSION" == "null" ]]; then
            echo "has_beta=false" >> $GITHUB_OUTPUT
            WC_VERSIONS=$( echo "[\"$WC_MIN_SUPPORTED_VERSION\", \"latest\"]" )
          else
            echo "has_beta=true" >> $GITHUB_OUTPUT
            WC_VERSIONS=$( echo "[\"$WC_MIN_SUPPORTED_VERSION\", \"latest\", \"beta\"]" )
          fi
          MATRIX_INCLUDE=$( echo "[{\"woocommerce\":\"$WC_MIN_SUPPORTED_VERSION\",\"wordpress\":\"$WP_MIN_SUPPORTED_VERSION\",\"gutenberg\":\"$GUTENBERG_FOR_WP_MIN\",\"php\":\"$PHP_MIN_SUPPORTED_VERSION\"}]" )
          echo "matrix={\"woocommerce\":$WC_VERSIONS,\"wordpress\":[\"latest\"],\"gutenberg\":[\"latest\"],\"php\":[\"7.4\"], \"include\":$MATRIX_INCLUDE}" >> $GITHUB_OUTPUT

  woocommerce-compatibility:
    name: "WC compatibility"
    needs: generate-wc-compat-matrix
    runs-on: ubuntu-latest
    env:
      WP_VERSION: ${{ matrix.wordpress }}
      WC_VERSION: ${{ matrix.woocommerce }}
      GUTENBERG_VERSION: ${{ matrix.gutenberg }}
    strategy:
      fail-fast:    false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.generate-wc-compat-matrix.outputs.matrix) }}
    steps:
      # clone the repository
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # enable dependencies caching
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.json') }}-${{ hashFiles('composer.lock') }}
      # setup PHP, but without debug extensions for reasonable performance
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none
      # run CI checks
      - run: bash bin/run-ci-tests.bash

  generate-wc-compat-beta-matrix:
    name: "Generate the matrix for compatibility-woocommerce-beta dynamically"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate_matrix.outputs.matrix }}
    steps:
      - name: "Generate matrix"
        id: generate_matrix
        run: |
          PHP_VERSIONS=$( echo "[\"7.4\", \"8.0\", \"8.1\"]" )
          echo "matrix={\"woocommerce\":[\"beta\"],\"wordpress\":[\"latest\"],\"gutenberg\":[\"latest\"],\"php\":$PHP_VERSIONS}" >> $GITHUB_OUTPUT

  # a dedicated job, as allowed to fail
  compatibility-wordpress-nightly:
    name: Environment - WP nightly
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        woocommerce: [ 'latest' ]
        wordpress: [ 'nightly' ]
        gutenberg: [ 'latest' ]
        php: [ '7.4' ]
    env:
      WP_VERSION: ${{ matrix.wordpress }}
      WC_VERSION: ${{ matrix.woocommerce }}
      GUTENBERG_VERSION: ${{ matrix.gutenberg }}
    steps:
      # clone the repository
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # enable dependencies caching
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.json') }}-${{ hashFiles('composer.lock') }}
      # setup PHP, but without debug extensions for reasonable performance
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none
      # run CI checks
      - run: bash bin/run-ci-tests.bash

  # a dedicated job, as allowed to fail
  compatibility-woocommerce-beta:
    name: Environment - WC beta
    needs: [ generate-wc-compat-matrix, generate-wc-compat-beta-matrix ]
    if: needs.generate-wc-compat-matrix.outputs.has_beta == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.generate-wc-compat-beta-matrix.outputs.matrix) }}
    env:
      WP_VERSION: ${{ matrix.wordpress }}
      WC_VERSION: ${{ matrix.woocommerce }}
      GUTENBERG_VERSION: ${{ matrix.gutenberg }}
    steps:
      # clone the repository
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # enable dependencies caching
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/
          key:  ${{ runner.os }}-composer-${{ hashFiles('composer.json') }}-${{ hashFiles('composer.lock') }}
      # setup PHP, but without debug extensions for reasonable performance
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          tools:       composer
          coverage:    none
      # run CI checks
      - run: bash bin/run-ci-tests.bash
