name: Prepare live branch for Jetpack Beta Builder

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-inform-zip-file:
    name: "Build and inform the zip file"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Get current version"
        id: current-version
        run: |
          VERSION=$(jq '.version' package.json -r)
          echo "Current version found: $VERSION" >> $GITHUB_STEP_SUMMARY
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: "Set up repository"
        uses: ./.github/actions/setup-repo

      - name: "Calculate the next version"
        id: next-version
        env:
          RELEASE_VERSION: ${{ steps.current-version.outputs.VERSION }}
        run: php .github/workflows/scripts/get-next-version.php # outputs.NEXT_RELEASE_VERSION

      - name: "Get dev version"
        id: get-dev-version
        env:
          NEXT_RELEASE_VERSION: ${{ steps.next-version.outputs.NEXT_RELEASE_VERSION }}
          PR_NUMBER: ${{ github.event.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          DEV_SUFFIX_VERSION="dev_PR-${PR_NUMBER}_commit-${PR_HEAD_SHA:0:7}"
          DEV_VERSION="${NEXT_RELEASE_VERSION}-${DEV_SUFFIX_VERSION}"
          echo "Dev Version: $DEV_VERSION" >> $GITHUB_STEP_SUMMARY          
          echo "DEV_VERSION=$DEV_VERSION" >> $GITHUB_OUTPUT

      - name: "Bump dev version"
        id: bump-dev-version
        env:
          DEV_VERSION: ${{ steps.get-dev-version.outputs.DEV_VERSION }}
        run: |
          # 'Version' header in woocommerce-payments.php
          sed -i "s/^ \* Version: .*$/ * Version: $DEV_VERSION/" woocommerce-payments.php

          # 'version' field in package.json
          sed -ri 's/("version": )".*"/\1"'${DEV_VERSION}'"/' package.json

          # 'Stable tag' header in readme.txt;
          sed -i "s/^Stable tag: .*$/Stable tag: $DEV_VERSION/" readme.txt

      - name: "Build the plugin"
        id: build_plugin
        uses: ./.github/actions/build

      - name: "Update the structure of artifacts for Jetpack Beta Builder" 
        run: |
          cd release
          mv woocommerce-payments woocommerce-payments-dev
          zip -q -r "woocommerce-payments-dev.zip" "woocommerce-payments-dev/"
          rm -fR "woocommerce-payments-dev"

      - name: "Add file size notice"
        run: |
          echo ":information_source: Ignore the artifact size mentioned since GitHub calculates the size of the source folder instead of the zip file created." >> $GITHUB_STEP_SUMMARY

      - name: "Upload the zip file as an artifact"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: plugins # Hard-coded value for Jetpack Beta Builder. The Playground link below fetches it by this name too.
          path: release
          # The Jetpack Beta Builder slurps it up within minutes, but the Playground link in the PR comment
          # downloads this artifact on every click, so it only works for as long as the artifact is retained.
          retention-days: 14

      - name: "Get plugin data for Jetpack Beta Builder"
        id: get-plugin-data
        env:
          DEV_VERSION: ${{ steps.get-dev-version.outputs.DEV_VERSION }}          
        run: |
          # Plugin data is passed as a JSON object.
          PLUGIN_DATA="{}"          
          PLUGIN_DATA=$( jq -c --arg slug "woocommerce-payments" --arg ver "$DEV_VERSION" '.[ $slug ] = { version: $ver }' <<<"$PLUGIN_DATA" )
          echo "plugin-data=$PLUGIN_DATA" >> $GITHUB_OUTPUT

      - name: "Inform Jetpack Beta Builder webhook"
        if: steps.get-plugin-data.outputs.plugin-data != '{}'
        env:
          SECRET: ${{ secrets.WCPAYBETA_SECRET }}
          PLUGIN_DATA: ${{ steps.get-plugin-data.outputs.plugin-data }}
          PR: ${{ github.event.number }}
        run: |
          curl -v --fail -L \
            --url "https://betadownload.jetpack.me/gh-action.php?run_id=$GITHUB_RUN_ID&pr=$PR&commit=$GITHUB_SHA" \
            --form-string "repo=$GITHUB_REPOSITORY" \
            --form-string "branch=${GITHUB_REF#refs/heads/}" \
            --form-string "plugins=$PLUGIN_DATA" \
            --form-string "secret=$SECRET"

      # The demo and connect previews need the plugin from dev/playground, which is not part of the plugin zip.
      - name: "Upload the Playground preview plugin as an artifact"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playground-preview
          path: dev/playground/mu-plugins
          if-no-files-found: error
          retention-days: 14

      # WordPress Playground runs in the visitor's browser and can only fetch public URLs.
      # Its artifact proxy serves this workflow's latest artifacts for the PR, looked up by
      # workflow name - hence GITHUB_WORKFLOW rather than a literal that a rename would silently break.
      # The `plugins` artifact wraps the plugin zip, so the Blueprints unzip it before installing.
      - name: "Build the WordPress Playground preview links"
        id: playground
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          ARTIFACT_PROXY=$( jq -rn \
            --arg org "$GITHUB_REPOSITORY_OWNER" \
            --arg repo "${GITHUB_REPOSITORY#*/}" \
            --arg workflow "$GITHUB_WORKFLOW" \
            --arg pr "$PR_NUMBER" \
            '"https://playground.wordpress.net/plugin-proxy.php?org=\($org|@uri)&repo=\($repo|@uri)&workflow=\($workflow|@uri)&pr=\($pr|@uri)"' )

          BLUEPRINTS=$( jq -cn --arg proxy "$ARTIFACT_PROXY" '
            {
              "$schema": "https://playground.wordpress.net/blueprint-schema.json",
              preferredVersions: { php: "8.3", wp: "latest" },
              features: { networking: true }
            } as $base
            | { step: "login", username: "admin" } as $login
            | { step: "installPlugin", pluginData: { resource: "wordpress.org/plugins", slug: "woocommerce" }, options: { activate: true } } as $woocommerce
            | [
                { step: "unzip", zipFile: { resource: "url", url: ( $proxy + "&artifact=plugins" ), caption: "Downloading the WooPayments build for this PR" }, extractToPath: "/tmp/pr" },
                { step: "installPlugin", pluginData: { resource: "vfs", path: "/tmp/pr/woocommerce-payments-dev.zip" }, options: { activate: true } }
              ] as $woopayments
            | [
                { step: "unzip", zipFile: { resource: "url", url: ( $proxy + "&artifact=playground-preview" ), caption: "Downloading the preview plugin" }, extractToPath: "/wordpress/wp-content/mu-plugins" }
              ] as $preview_plugin
            | [
                { step: "runPHP", code: "<?php require \"/wordpress/wp-load.php\"; require WPMU_PLUGIN_DIR . \"/wcpay-playground-preview/setup.php\";" }
              ] as $preview_setup
            | {
                unconnected: ( $base + {
                  landingPage: "/wp-admin/admin.php?page=wc-admin&path=/payments/connect",
                  steps: ( [
                    $login,
                    $woocommerce,
                    { step: "runPHP", code: "<?php require \"/wordpress/wp-load.php\"; delete_transient( \"_wc_activation_redirect\" ); update_option( \"woocommerce_onboarding_profile\", array( \"skipped\" => true ) );" }
                  ] + $woopayments )
                } ),
                demo: ( $base + {
                  landingPage: "/wp-admin/admin.php?page=wc-admin&path=/payments/overview",
                  constants: { WCPAY_PLAYGROUND_PREVIEW: "demo" },
                  steps: ( [ $login ] + $preview_plugin + [ $woocommerce ] + $woopayments + $preview_setup )
                } ),
                connect: ( $base + {
                  landingPage: "/wp-admin/admin.php?page=wcpay-playground-connect",
                  constants: { WCPAY_PLAYGROUND_PREVIEW: "connect" },
                  steps: ( [ $login ] + $preview_plugin + [ $woocommerce ] + $woopayments + $preview_setup )
                } )
              }' )

          {
            echo "url=https://playground.wordpress.net/#$( jq -rn --argjson blueprints "$BLUEPRINTS" '$blueprints.unconnected|tojson|@uri' )"
            echo "demo_url=https://playground.wordpress.net/#$( jq -rn --argjson blueprints "$BLUEPRINTS" '$blueprints.demo|tojson|@uri' )"
            echo "connect_url=https://playground.wordpress.net/#$( jq -rn --argjson blueprints "$BLUEPRINTS" '$blueprints.connect|tojson|@uri' )"
          } >> "$GITHUB_OUTPUT"

      - name: "Add/update the information as a comment in the PR"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLAYGROUND_URL: ${{ steps.playground.outputs.url }}
          PLAYGROUND_DEMO_URL: ${{ steps.playground.outputs.demo_url }}
          PLAYGROUND_CONNECT_URL: ${{ steps.playground.outputs.connect_url }}
          # The connect preview asks for a sandbox connection, which the code under review could read.
          IS_FORK_PR: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          PR_NUMBER: ${{ github.event.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.head_ref }}
        run: |
          # Debug: Check environment variables
          echo "=== Debug: Environment Variables ==="
          echo "PR_NUMBER: ${PR_NUMBER}"
          echo "PR_HEAD_REF: ${PR_HEAD_REF}"
          echo "PR_HEAD_SHA: ${PR_HEAD_SHA}"
          echo "GITHUB_REPOSITORY: ${GITHUB_REPOSITORY}"
          echo "===================================="

          PLAYGROUND_CONNECT_ITEM=""
          if [ "$IS_FORK_PR" != "true" ]; then
            PLAYGROUND_CONNECT_ITEM="- :link: [Open and connect a sandbox](${PLAYGROUND_CONNECT_URL}): paste the connection of a sandbox site you already have, and the store talks to the real server and takes test payments."
          fi

          echo "Creating comment body..."
          BODY="### Test the build 
          
          #### Option 1. Jetpack Beta
          
          - Install and activate [Jetpack Beta](https://jetpack.com/beta/#download-and-install).
          - Use this build by searching for PR number \`${PR_NUMBER}\` or branch name \`${PR_HEAD_REF}\` in your-test.site/wp-admin/admin.php?page=jetpack-beta&plugin=woocommerce-payments          
          
          #### Option 2. Jurassic Ninja - available for logged-in A12s
         
          :rocket: [Launch a JN site with this branch and sample products](https://jurassic.ninja/create/?jetpack-beta&nojetpack&woocommerce&woocommerce-import-sample-data&woocommerce-payments-dev-tools&branches.woocommerce-payments=${PR_HEAD_REF}) :rocket:
          
          :information_source: Install this [Tampermonkey script](https://github.com/Automattic/woocommerce-payments/tree/develop/bin/wcpay-live-branches) to get more options.

          #### Option 3. WordPress Playground - runs in your browser

          - :test_tube: [Open with demo data](${PLAYGROUND_DEMO_URL}): the store looks connected and shows made-up balances, payouts, transactions and disputes. It cannot take payments.
          - :electric_plug: [Open unconnected](${PLAYGROUND_URL}): a fresh store on the Connect screen. Connecting from there does not work.
          ${PLAYGROUND_CONNECT_ITEM}

          :information_source: None of these can onboard a new account or receive webhooks. The demo data never changes, so it shows how screens look, not how the server behaves. The links stop working 14 days after the last build.

          ---

          Build info: 
          
          - Latest commit: ${PR_HEAD_SHA}
          - Build time: $(date -u "+%Y-%m-%d %H:%M:%S UTC")

          _Note: the build is updated when a new commit is pushed to this PR._"
          # End declaring variable BODY

          echo "Comment body created successfully"

          # Find existing build comment with better error handling
          echo "Searching for existing comment..."
          COMMENT_ID=$(gh pr view ${PR_NUMBER} --json comments --jq '.comments[]? | select(.body | contains("### Test the build")) | .url' 2>/dev/null | head -1 | grep -o '[0-9]*$' || echo "")

          if [ -n "$COMMENT_ID" ]; then
            echo "Found existing comment ID: $COMMENT_ID"
            echo "Updating existing comment..."
            gh api repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID} -X PATCH -f body="${BODY}"  2>/dev/null || {
              echo "ERROR: Failed to update existing comment"
              exit 1
            }
            echo "Comment updated successfully"
          else
            echo "No existing comment found, creating new one..."
            gh api repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments -f body="${BODY}" 2>/dev/null || {
              echo "ERROR: Failed to create new comment"
              exit 1
            }
            echo "New comment created successfully"
          fi
